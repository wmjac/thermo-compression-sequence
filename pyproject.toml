[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-models"
version = "0.1.0"
description = "Reproducible thermodynamic mixture-model training and canonicalization"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mixture-models = "mixture_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
